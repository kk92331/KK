<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezentacja Przestrzeni</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-grey">
    <header><div class="container nav-demo"><a href="index.html">← Powrót</a><strong>Panel Błonie</strong></div></header>
    <main class="container py-40">
        <div class="demo-layout">
            <aside class="card shadow-effect">
                <h3>Zarządzaj m²</h3>
                <div class="form-group"><label>Klient</label><input type="text" id="itemName"></div>
                <div class="form-group"><label>Rozmiar (m²)</label><input type="number" id="itemSize"></div>
                <button id="addItem" class="btn-primary w-100">Dodaj</button>
                <div class="stats mt-20">
                    Wolne: <strong id="free-space">Liczę...</strong>
                    <div class="progress-bar mt-10"><div id="progress-inner"></div></div>
                </div>
            </aside>
            <div class="warehouse-floor shadow-effect" id="warehouseGrid"></div>
        </div>
    </main>
    <script src="demo.js"></script>
    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
